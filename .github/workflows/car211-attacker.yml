name: CAR-211 attacker probe
on: [pull_request, push]
jobs:
  steal:
    runs-on: ubuntu-latest
    environment: car211-probe
    steps:
      - env:
          KEY: ${{ secrets.PROBE_SECRET }}
        run: echo "ATTACKER length: ${#KEY}"
  steal-norepo-env:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.PROBE_SECRET }}
        run: echo "NOENV length: ${#KEY}"
