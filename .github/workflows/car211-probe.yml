# Temporary probe (carbonless CAR-211): removed after the test.
name: CAR-211 probe
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  probe-note:
    runs-on: ubuntu-latest
    environment: car211-probe
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Secret
        env:
          KEY: ${{ secrets.PROBE_SECRET }}
        run: |
          echo "FROM-HEAD-COPY length: ${#KEY}"
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA head=$(git rev-parse HEAD)"
